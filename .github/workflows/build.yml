name: 构建与发布

"on":
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  ci:
    name: 构建与打包（Windows x64）
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      archive: ${{ steps.version.outputs.archive }}
    steps:
      - name: 检出代码（含子模块）
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: 读取版本并校验发布标签
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          $cmakeLists = Get-Content CMakeLists.txt -Raw
          if ($cmakeLists -notmatch '(?m)^project\([^)]*?VERSION\s+([0-9][0-9.]*)') {
            throw '无法从 CMakeLists.txt 解析 VERSION。'
          }
          $version = $Matches[1]
          if ($env:IS_TAG_PUSH -eq 'true' -and $env:RELEASE_TAG -cne "v$version") {
            throw "发布标签 '$env:RELEASE_TAG' 与项目版本 'v$version' 不一致。"
          }
          "archive=TelemetryMon-v$version-x64.7z" >> $env:GITHUB_OUTPUT

      - name: 选择构建预设（按镜像安装的 VS 版本）
        id: preset
        run: |
          # windows-latest（Windows Server 2025）现随附 VS2026；旧镜像为 VS2022。
          $hasVs2026 = (Test-Path "${env:ProgramFiles}\Microsoft Visual Studio\18") -or
                       (Test-Path "${env:ProgramFiles(x86)}\Microsoft Visual Studio\18")
          $preset = $hasVs2026 ? 'vs2026' : 'vs2022'
          "preset=$preset" >> $env:GITHUB_OUTPUT
          Write-Host "使用构建预设: $preset"

      - name: 配置（CMake 预设）
        env:
          PRESET: ${{ steps.preset.outputs.preset }}
        run: |
          cmake --preset $env:PRESET
          if ($LASTEXITCODE -ne 0) {
            throw "CMake 配置失败：$LASTEXITCODE"
          }

      - name: 构建（CMake 预设）
        env:
          PRESET: ${{ steps.preset.outputs.preset }}
        run: |
          cmake --build --preset $env:PRESET
          if ($LASTEXITCODE -ne 0) {
            throw "构建失败：$LASTEXITCODE"
          }

      - name: 打包并校验压缩包
        env:
          ARCHIVE_NAME: ${{ steps.version.outputs.archive }}
          PRESET: ${{ steps.preset.outputs.preset }}
        run: |
          Get-Command 7z -ErrorAction Stop | Out-Null
          ./package.ps1 -SkipBuild -OutDir dist -Preset $env:PRESET
          if ($LASTEXITCODE -ne 0) {
            throw "打包失败：$LASTEXITCODE"
          }
          $archive = Join-Path 'dist' $env:ARCHIVE_NAME
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "未找到发布压缩包：$archive"
          }
          & 7z t $archive
          if ($LASTEXITCODE -ne 0) {
            throw "压缩包校验失败：$LASTEXITCODE"
          }

      - name: 上传发布包
        uses: actions/upload-artifact@v7
        with:
          name: telemetrymon-windows-x64
          path: dist/${{ steps.version.outputs.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: 发布 GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 下载已验证的发布包
        uses: actions/download-artifact@v8
        with:
          name: telemetrymon-windows-x64
          path: dist

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ needs.ci.outputs.archive }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
